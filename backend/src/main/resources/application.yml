server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://host.docker.internal:5433/course_db
    username: course_admin
    password: course_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: course
        format_sql: true
