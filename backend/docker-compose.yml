services:
  course-track-service:
    build: .
    container_name: course-track-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/course_db
      SPRING_DATASOURCE_USERNAME: course_admin
      SPRING_DATASOURCE_PASSWORD: course_pass
