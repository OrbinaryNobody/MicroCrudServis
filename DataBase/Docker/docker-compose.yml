version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: course-postgres
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: course_admin
      POSTGRES_PASSWORD: course_pass

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d

    restart: unless-stopped

volumes:
  pgdata:
